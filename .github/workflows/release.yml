name: Release

# Triggered when a version tag (v*) is pushed to the repository
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write  # Allows publishing to GitHub Releases via GITHUB_TOKEN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build and publish release
        run: npm run release
        env:
          # GH_TOKEN is the repository's automatic built-in token (GITHUB_TOKEN)
          # electron-builder reads this to authenticate and publish to GitHub Releases
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
